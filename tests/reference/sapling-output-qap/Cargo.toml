[package]
name = "sapling-output-qap-reference"
version = "0.1.0"
edition = "2024"

[dependencies]
bellman = { version = "=0.15.0", default-features = false }
bls12_381 = "=0.9.0"
ff = "=0.14.0"
groth16 = "=0.2.0"
rand_core = "=0.10.1"
rand_xorshift = "=0.5.0"
sha2 = "=0.10.9"
sapling-crypto = { git = "https://github.com/zcash/sapling-crypto.git", rev = "88a7946b4a3066787776e11f0a502654167e022d", features = ["circuit", "temporary-zcashd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jubjub = "=0.11.1"
group = "=0.14.0"
blake2s_simd = "=1.0.5"
byteorder = "=1.5.0"
